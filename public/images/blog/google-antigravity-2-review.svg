<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Google Antigravity 2.0 Review featured image</title>
  <desc id="desc">A command center visual with multiple autonomous AI agents executing tasks in parallel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset=".48" stop-color="#121826"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Main Shell Mockup -->
    <rect x="180" y="120" width="1240" height="660" rx="36" fill="#020617" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
    <!-- Shell Header -->
    <rect x="180" y="120" width="1240" height="70" rx="36" fill="#0b0f19"/>
    <!-- Mockup window dots -->
    <circle cx="230" cy="155" r="9" fill="#ef4444"/>
    <circle cx="260" cy="155" r="9" fill="#f59e0b"/>
    <circle cx="290" cy="155" r="9" fill="#10b981"/>
    
    <!-- Central Grid Layout -->
    <!-- Large Left Panel: Agent Orchestrator -->
    <rect x="230" y="220" width="700" height="380" rx="24" fill="#0f172a" stroke="rgba(0, 229, 255, 0.15)" stroke-width="2"/>
    <text x="270" y="275" fill="#00e5ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">AGENT ORCHESTRATOR</text>
    
    <!-- OS Build flow diagram lines -->
    <rect x="270" y="315" width="280" height="60" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="290" y="352" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Agent #1: Kernel Core</text>
    <rect x="580" y="315" width="310" height="60" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="600" y="352" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Agent #2: Keyboard Drivers</text>
    
    <!-- Mid-Build connection line -->
    <path d="M 550 345 L 580 345" stroke="#7c3aed" stroke-width="3" fill="none"/>
    
    <!-- Big console log output -->
    <rect x="270" y="405" width="620" height="160" rx="16" fill="#020617"/>
    <text x="295" y="445" fill="#4ade80" font-family="monospace" font-size="15">&gt; Starting OS build overnight...</text>
    <text x="295" y="480" fill="#4ade80" font-family="monospace" font-size="15">&gt; Orchestrating 93 parallel subagents...</text>
    <text x="295" y="515" fill="#00e5ff" font-family="monospace" font-size="15">&gt; Drivers generated successfully in real-time. Doom running.</text>
    <text x="295" y="550" fill="#fbbf24" font-family="monospace" font-size="15">&gt; Build finished. API credits used: $980.</text>
    
    <!-- Right Sidebar Panels -->
    <!-- Panel 1 -->
    <rect x="960" y="220" width="410" height="110" rx="20" fill="url(#accent)" opacity="0.9"/>
    <text x="990" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">ANTIGRAVITY 2.0</text>
    <text x="990" y="300" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="14" font-weight="400">Standalone Agent Workspace</text>
    
    <!-- Panel 2 -->
    <rect x="960" y="355" width="410" height="110" rx="20" fill="#1e1b4b" stroke="rgba(255,255,255,0.05)"/>
    <text x="990" y="405" fill="#a78bfa" font-family="Arial, sans-serif" font-size="20" font-weight="700">GEMINI 3.5 FLASH</text>
    <text x="990" y="435" fill="#4b5563" font-family="Arial, sans-serif" font-size="14">4x Latency Compounding Speed</text>
    
    <!-- Panel 3 -->
    <rect x="960" y="490" width="410" height="110" rx="20" fill="#0f172a" stroke="rgba(255,255,255,0.05)"/>
    <text x="990" y="540" fill="#38bdf8" font-family="Arial, sans-serif" font-size="20" font-weight="700">MANAGED AGENTS</text>
    <text x="990" y="570" fill="#4b5563" font-family="Arial, sans-serif" font-size="14">One-Click Google Infrastructure</text>

    <!-- Bottom Timeline Bar -->
    <rect x="230" y="630" width="1140" height="80" rx="20" fill="#0b0f19" stroke="rgba(255,255,255,0.03)"/>
    <text x="270" y="677" fill="#4b5563" font-family="Arial, sans-serif" font-size="15">PARALLEL THREADS: </text>
    <rect x="440" y="655" width="220" height="30" rx="15" fill="rgba(0, 229, 255, 0.15)"/>
    <text x="460" y="675" fill="#00e5ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">93 Sub-Agents</text>
    
    <rect x="680" y="655" width="200" height="30" rx="15" fill="rgba(124, 58, 237, 0.15)"/>
    <text x="700" y="675" fill="#a78bfa" font-family="Arial, sans-serif" font-size="13" font-weight="700">12h Autonomous Build</text>
    
    <rect x="900" y="655" width="220" height="30" rx="15" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="920" y="675" fill="#4ade80" font-family="Arial, sans-serif" font-size="13" font-weight="700">2.6 Billion Tokens</text>
    
    <rect x="1140" y="655" width="200" height="30" rx="15" fill="rgba(251, 191, 36, 0.15)"/>
    <text x="1160" y="675" fill="#fbbf24" font-family="Arial, sans-serif" font-size="13" font-weight="700">Cost: Under $1,000</text>
  </g>
</svg>
