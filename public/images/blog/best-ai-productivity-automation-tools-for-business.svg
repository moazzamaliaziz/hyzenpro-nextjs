<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Best AI Productivity and Automation Tools for Business</title>
  <desc id="desc">A sleek modern editorial dashboard mockup showcasing AI agents and automated workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#fae8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="#6366f1" opacity=".12"/>
  <circle cx="1400" cy="700" r="220" fill="#d946ef" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="200" y="160" width="1200" height="580" rx="36" fill="#ffffff"/>
    <rect x="200" y="160" width="1200" height="90" rx="36" fill="#0f172a"/>
    <!-- window controls -->
    <circle cx="270" cy="205" r="12" fill="#ef4444"/>
    <circle cx="310" cy="205" r="12" fill="#eab308"/>
    <circle cx="350" cy="205" r="12" fill="#22c55e"/>
    
    <!-- content layout -->
    <rect x="270" y="310" width="310" height="340" rx="24" fill="#eff6ff"/>
    <rect x="645" y="310" width="310" height="340" rx="24" fill="#faf5ff"/>
    <rect x="1020" y="310" width="310" height="340" rx="24" fill="#fdf2f8"/>
    
    <!-- graphics representing productivity/automation -->
    <!-- Card 1: chat/writing nodes -->
    <rect x="330" y="360" width="190" height="40" rx="12" fill="#3b82f6"/>
    <rect x="330" y="420" width="140" height="20" rx="6" fill="#93c5fd"/>
    <circle cx="350" cy="520" r="30" fill="#60a5fa" opacity=".5"/>
    <circle cx="480" cy="520" r="30" fill="#3b82f6"/>
    <path d="M380 520h70" stroke="#ffffff" stroke-width="6"/>

    <!-- Card 2: automation paths/loops -->
    <rect x="705" y="360" width="190" height="40" rx="12" fill="#a855f7"/>
    <rect x="705" y="420" width="120" height="20" rx="6" fill="#d8b4fe"/>
    <!-- node connector diagram -->
    <circle cx="735" cy="520" r="20" fill="#a855f7"/>
    <circle cx="865" cy="520" r="20" fill="#d946ef"/>
    <path d="M755 520h90" stroke="#a855f7" stroke-width="6" stroke-dasharray="8 8"/>

    <!-- Card 3: charts/metrics -->
    <rect x="1080" y="360" width="190" height="40" rx="12" fill="#ec4899"/>
    <rect x="1080" y="420" width="160" height="20" rx="6" fill="#fbcfe8"/>
    <!-- chart bar graphic -->
    <path d="M1110 570v-70M1155 570v-100M1200 570v-40M1245 570v-85" stroke="#db2777" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
