<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI writing tool comparison graph</title>
  <desc id="desc">Radar-style comparison of ChatGPT, Jasper, and Claude across writing quality factors.</desc>
  <rect width="1200" height="720" rx="30" fill="#ffffff"/>
  <rect x="48" y="48" width="1104" height="624" rx="24" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="95" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Writing Tool Fit by Use Case</text>
  <g stroke="#cbd5e1" stroke-width="2" fill="none">
    <polygon points="600,176 810,300 810,540 600,650 390,540 390,300"/>
    <polygon points="600,236 758,330 758,510 600,590 442,510 442,330"/>
    <polygon points="600,296 706,360 706,480 600,530 494,480 494,360"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#475569" text-anchor="middle">
    <text x="600" y="155">Long-form</text>
    <text x="855" y="304">Brand voice</text>
    <text x="855" y="548">Ease</text>
    <text x="600" y="686">Value</text>
    <text x="345" y="548">Accuracy</text>
    <text x="345" y="304">Marketing</text>
  </g>
  <polygon points="600,230 725,350 760,520 600,615 480,500 430,330" fill="#0ea5e9" opacity=".28" stroke="#0ea5e9" stroke-width="5"/>
  <polygon points="600,185 790,315 720,490 560,555 470,465 410,315" fill="#22c55e" opacity=".24" stroke="#22c55e" stroke-width="5"/>
  <polygon points="600,190 735,330 790,520 630,580 430,455 470,340" fill="#f97316" opacity=".22" stroke="#f97316" stroke-width="5"/>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">
    <rect x="92" y="580" width="250" height="44" rx="22" fill="#e0f2fe"/>
    <text x="125" y="609">ChatGPT: value</text>
    <rect x="92" y="520" width="250" height="44" rx="22" fill="#dcfce7"/>
    <text x="125" y="549">Jasper: brand</text>
    <rect x="92" y="460" width="250" height="44" rx="22" fill="#ffedd5"/>
    <text x="125" y="489">Claude: nuance</text>
  </g>
</svg>
