<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Top frontier AI models 2026 comparison</title>
  <desc id="desc">A refined HyzenPro benchmark dashboard comparing five frontier AI models across reasoning, coding, math, and tool use.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".55" stop-color="#18181b"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".55" stop-color="#52525b"/>
      <stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1340" cy="140" r="220" fill="#fff" opacity=".08"/>
  <circle cx="220" cy="780" r="280" fill="#000" opacity=".28"/>
  <g filter="url(#shadow)">
    <rect x="150" y="110" width="1300" height="680" rx="38" fill="#0a0a0a"/>
    <rect x="150" y="110" width="1300" height="680" rx="38" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="205" y="175" width="1190" height="90" rx="24" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="245" y="214" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">HYZENPRO BENCHMARK BRIEF</text>
    <text x="245" y="247" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800">Frontier AI Model Rankings 2026</text>
    <text x="1055" y="232" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="18" font-weight="700">AIME • SWE-Bench • ARC-AGI-2</text>

    <g transform="translate(205 310)">
      <rect width="410" height="360" rx="28" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="34" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="800">Model Shortlist</text>
      <text x="34" y="84" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="15">Five leading frontier systems</text>
      <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
        <circle cx="48" cy="135" r="8" fill="#ffffff"/>
        <text x="72" y="142" fill="#ffffff">GPT-5.5</text>
        <circle cx="48" cy="178" r="8" fill="#d4d4d8"/>
        <text x="72" y="185" fill="#e5e7eb">Claude Opus 4.7</text>
        <circle cx="48" cy="221" r="8" fill="#a1a1aa"/>
        <text x="72" y="228" fill="#d4d4d8">Gemini 3.1 Pro</text>
        <circle cx="48" cy="264" r="8" fill="#71717a"/>
        <text x="72" y="271" fill="#d4d4d8">Grok 4</text>
        <circle cx="48" cy="307" r="8" fill="#ca8a04"/>
        <text x="72" y="314" fill="#d4d4d8">DeepSeek V4-Pro</text>
      </g>
    </g>

    <g transform="translate(660 310)">
      <rect width="735" height="360" rx="28" fill="#ffffff" fill-opacity=".94"/>
      <text x="40" y="58" fill="#111827" font-family="Arial, sans-serif" font-size="25" font-weight="800">Benchmark Comparison</text>
      <text x="40" y="88" fill="#71717a" font-family="Arial, sans-serif" font-size="15">Editorial snapshot for model selection</text>
      <line x1="60" y1="300" x2="675" y2="300" stroke="#e4e4e7" stroke-width="2"/>
      <line x1="60" y1="235" x2="675" y2="235" stroke="#f4f4f5" stroke-width="2"/>
      <line x1="60" y1="170" x2="675" y2="170" stroke="#f4f4f5" stroke-width="2"/>
      <line x1="60" y1="105" x2="675" y2="105" stroke="#f4f4f5" stroke-width="2"/>
      <g fill="url(#bar)">
        <rect x="95" y="128" width="58" height="172" rx="12"/>
        <rect x="205" y="154" width="58" height="146" rx="12"/>
        <rect x="315" y="141" width="58" height="159" rx="12"/>
        <rect x="425" y="134" width="58" height="166" rx="12"/>
        <rect x="535" y="118" width="58" height="182" rx="12"/>
      </g>
      <g fill="#52525b" font-family="Arial, sans-serif" font-size="13" font-weight="700">
        <text x="88" y="330">GPT</text>
        <text x="194" y="330">Claude</text>
        <text x="304" y="330">Gemini</text>
        <text x="424" y="330">Grok</text>
        <text x="524" y="330">DeepSeek</text>
      </g>
    </g>
  </g>
</svg>
