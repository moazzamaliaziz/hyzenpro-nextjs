<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI marketing stack under one hundred dollars graph</title>
  <desc id="desc">A budget allocation chart for a lean AI marketing stack under 100 dollars per month.</desc>
  <rect width="1200" height="720" rx="30" fill="#ffffff"/>
  <rect x="48" y="48" width="1104" height="624" rx="24" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="95" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">AI Marketing Stack Under $100/month</text>
  <text x="95" y="160" font-family="Arial, sans-serif" font-size="20" fill="#64748b">Start with one tool per function, then add only when the workflow proves itself.</text>
  <g>
    <rect x="115" y="245" width="840" height="64" rx="18" fill="#0ea5e9"/>
    <rect x="115" y="335" width="660" height="64" rx="18" fill="#22c55e"/>
    <rect x="115" y="425" width="360" height="64" rx="18" fill="#f97316"/>
    <rect x="115" y="515" width="260" height="64" rx="18" fill="#8b5cf6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">
    <text x="115" y="225">Writesonic or ChatGPT</text>
    <text x="115" y="315">Mailchimp starter</text>
    <text x="115" y="405">Buffer</text>
    <text x="115" y="495">Hotjar</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">
    <text x="890" y="286">$20-49</text>
    <text x="710" y="376">$13+</text>
    <text x="410" y="466">$6+</text>
    <text x="315" y="556">$0-39</text>
  </g>
  <circle cx="1012" cy="420" r="100" fill="#111827"/>
  <text x="1012" y="400" font-family="Arial, sans-serif" font-size="24" fill="#e5e7eb" text-anchor="middle">Lean setup</text>
  <text x="1012" y="452" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">&lt;$100</text>
</svg>
