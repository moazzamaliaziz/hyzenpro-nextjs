<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Monthly AI stack cost graph</title>
  <desc id="desc">Bar chart showing a lean small business AI stack totaling about 62 dollars per month.</desc>
  <rect width="1200" height="720" rx="30" fill="#ffffff"/>
  <rect x="48" y="48" width="1104" height="624" rx="24" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="95" y="118" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Lean AI Stack Cost, Per Month</text>
  <text x="95" y="160" font-family="Arial, sans-serif" font-size="20" fill="#64748b">A practical starter set stays near $62/month before usage-based upgrades.</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#475569">
    <text x="95" y="610">ChatGPT</text>
    <text x="255" y="610">Make</text>
    <text x="415" y="610">Canva</text>
    <text x="575" y="610">VEED</text>
    <text x="735" y="610">Tidio</text>
  </g>
  <line x1="95" y1="560" x2="930" y2="560" stroke="#cbd5e1" stroke-width="2"/>
  <g>
    <rect x="105" y="300" width="92" height="260" rx="14" fill="#0ea5e9"/>
    <rect x="265" y="443" width="92" height="117" rx="14" fill="#14b8a6"/>
    <rect x="425" y="365" width="92" height="195" rx="14" fill="#22c55e"/>
    <rect x="585" y="326" width="92" height="234" rx="14" fill="#f97316"/>
    <rect x="745" y="560" width="92" height="0" rx="14" fill="#94a3b8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="151" y="282">$20</text>
    <text x="311" y="425">$9</text>
    <text x="471" y="347">$15</text>
    <text x="631" y="308">$18</text>
    <text x="791" y="540">$0</text>
  </g>
  <circle cx="1010" cy="384" r="96" fill="#111827"/>
  <text x="1010" y="370" font-family="Arial, sans-serif" font-size="24" fill="#e5e7eb" text-anchor="middle">Total</text>
  <text x="1010" y="420" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#fff" text-anchor="middle">$62</text>
</svg>
