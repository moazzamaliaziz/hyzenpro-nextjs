  <text x="198" y="360" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Inbound Lead</text>
  <text x="198" y="392" text-anchor="middle" fill="#D1FAF7" font-family="Arial, sans-serif" font-size="16">Source, budget, market</text>
  <rect x="446" y="298" width="220" height="140" rx="18" fill="#FFFFFF" stroke="#0D7377" stroke-width="2"/>
  <text x="556" y="352" text-anchor="middle" fill="#0D7377" font-family="Arial, sans-serif" font-size="24" font-weight="700">Router</text>
  <text x="556" y="390" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif" font-size="16">Checks plan value, country, and owner</text>
