  <text x="128" y="560" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">Why this matters</text>
  <text x="128" y="596" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">A visual router stops automation logic from disappearing into nested condition menus.</text>
  <text x="128" y="624" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">Teams can see exactly why a lead moved down one path instead of another.</text>
