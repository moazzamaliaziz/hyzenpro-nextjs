  <text x="92" y="172" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">Routing Rules</text>
  <text x="92" y="208" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">One inbound event can split into sales, support, or nurture workflows without rebuilding the scenario.</text>
