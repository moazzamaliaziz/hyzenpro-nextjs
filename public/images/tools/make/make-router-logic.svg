  <text x="848" y="236" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">Create deal, assign AE, alert Slack</text>
  <rect x="812" y="312" width="272" height="136" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="848" y="360" fill="#111827" font-family="Arial, sans-serif" font-size="22" font-weight="700">SMB Funnel</text>
  <text x="848" y="394" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">Budget below threshold</text>
  <text x="848" y="422" fill="#6B7280" font-family="Arial, sans-serif" font-size="16">Send nurture email and tag CRM</text>
